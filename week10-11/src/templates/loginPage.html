<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <center>
      <form action="/checkLogin" method="post">
        <table>
          <tr style="background-color: #c2c2c2">
            <td>
              <input name="login" type="text" value="" placeholder="Login" />
            </td>
          </tr>
          <tr style="background-color: #17a717">
            <td>
              <input
                name="passwd"
                type="password"
                value=""
                placeholder="Password"
              />
            </td>
          </tr>
          <tr style="background-color: #17db68">
            <td><input name="clear" type="reset" value="Clear" /></td>
          </tr>
          <tr style="background-color: #17a717">
            <td><input name="commit" type="submit" value="Login" /></td>
          </tr>
        </table>
      </form>
    </center>
  </body>
</html>
